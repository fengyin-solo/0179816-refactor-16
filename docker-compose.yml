# Compose 会自动读取仓库根目录的 .env，本地开发（vite.config.js）也读取同一份。
# 改端口或 Node 版本只需修改 .env，无需改动本文件或 Dockerfile。
services:
  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
        PORT: ${PORT}
    container_name: guqin-audio-analyzer
    # 运行环境变量，供 nginx 启动脚本替换 nginx.conf 模板中的 ${PORT}
    environment:
      PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
